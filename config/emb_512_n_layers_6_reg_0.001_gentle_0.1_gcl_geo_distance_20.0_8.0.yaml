name: emb_512_n_layers_6_reg_0.001_gentle_0.1_gcl_geo_distance_20.0_8.0

defaults:
  - base
  - _self_

training:
  batch_size: 1024
  device: cuda
  n_epochs: 1000
  early_stopping: 20
  lr: 0.001
  reg_weight: 0.001

  gcl_reg: 0.1
  gcl_eps: 0.1
  gcl_temp: 0.3

evaluation:
  batch_size: 1024
  rank: 20

model:
  embedding_dim: 512
  n_layers: 6
  layer_weighting: gentle
  layer_decay: 0.1

  geo_threshold: 20.0
  geo_sigma: 8.0