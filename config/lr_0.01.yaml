name: "lr_0.01"

training:
  batch_size: 1024
  device: "cuda"
  n_epochs: 1000
  early_stopping: 5
  lr: 0.01
  reg_weight: 0.0001

evaluation:
  batch_size: 1024
  rank: 20

model:
  embedding_dim: 64
  n_layers: 3

paths:
  raw: "./dataset/raw"
  processed: "./dataset/processed"

  country: "${paths.processed}/${dataset.country}"
  meta: "${paths.country}/meta"
  review: "${paths.country}/review"
  splits: "${paths.country}/splits"

  result: "./results"
  embedding: "./embeddings"
  log: "./logs"

dataset:
  min_num_reviews: 5
  min_rating: 4
  country: "Japanese"
  meta_keys: ["gmap_id", "name", "address", "latitude", "longitude", "category", "avg_rating", "num_of_reviews", "price", "hours"]
  review_keys: ["gmap_id", "user_id", "name", "time", "rating"]