defaults:
  - base
  - _self_

embeddings:
  - name: LightGCN Baseline (Dot)
    type: dot
    model: baseline

  - name: LightGCN Baseline (Cosine)
    type: cosine
    model: baseline

  - name: LightGCN Baseline (Distance)
    type: distance
    model: baseline

  - name: LightGCN Best (Dot)
    type: dot
    model: best

  - name: LightGCN Best (Cosine)
    type: cosine
    model: best

  - name: LightGCN Best (Distance)
    type: distance
    model: best

baselines:
  - name: "KNN (Centroid)"
    type: centroid
    model: knn

  - name: "KNN (Latest)"
    type: latest
    model: knn

  - name: "Popularity (Centroid)"
    type: centroid
    model: popularity

  - name: "Popularity (Latest)"
    type: latest
    model: popularity

test:
  batch_size: 1024
  rank: 20

inference:
  min_num_reviews: 10
  num_samples: 50
  topk: 20
  log:
    type: dot
    model: best
    user_ids: []